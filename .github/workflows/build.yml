name: Build

on:
  push:
    branches: [main, fabric]
  pull_request:
    branches: [main, fabric]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mc_target: '26.3'
            java_version: '25'
          - mc_target: '26.2'
            java_version: '25'
          - mc_target: '1.21'
            java_version: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gradle runs on 25 (Loom 1.19 needs it); the toolchain picks 21 or 25.
      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build --no-daemon -PmcTarget="${{ matrix.mc_target }}"
