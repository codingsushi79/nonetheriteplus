name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.6.1)
        required: true
      changelog:
        description: Changelog (markdown)
        required: false
        default: ''
      legs:
        description: Optional comma-separated matrix ids to run (e.g. fabric-1.21); empty runs all
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Paper API-compatible builds (Paper/Spigot/Bukkit/Purpur/Folia all run the same jar)
          - id: paper-26
            mc_target: '26'
            java_version: '25'
            jar_suffix: '26.x.x'
            modrinth_loaders: |-
              paper
              spigot
              bukkit
              purpur
              folia
            modrinth_game_versions: |-
              26.1.x
              26.2
              26.3
          - id: paper-1.21
            mc_target: '1.21'
            java_version: '21'
            jar_suffix: '1.21.x'
            modrinth_loaders: |-
              paper
              spigot
              bukkit
              purpur
              folia
            modrinth_game_versions: |-
              1.21.x
          # Fabric mod build. Quilt is tagged onto the same jar: Quilt Loader
          # runs Fabric mods unmodified via Quilted Fabric API, and this mod
          # only uses stock fabric-api, so there's no separate Quilt codebase.
          - id: fabric-26.3
            ref: fabric
            mc_target: '26.3'
            java_version: '25'
            jar_suffix: 'fabric-26.3'
            modrinth_loaders: |-
              fabric
              quilt
            modrinth_game_versions: |-
              26.3
          - id: fabric-26.2
            ref: fabric
            mc_target: '26.2'
            java_version: '25'
            jar_suffix: 'fabric-26.2'
            modrinth_loaders: |-
              fabric
              quilt
            modrinth_game_versions: |-
              26.2
          - id: fabric-1.21
            ref: fabric
            mc_target: '1.21'
            java_version: '21'
            jar_suffix: 'fabric-1.21.x'
            modrinth_loaders: |-
              fabric
              quilt
            modrinth_game_versions: |-
              1.21.4
          # Forge mod builds (separate codebase, see the `forge` branch).
          - id: forge-26.3
            ref: forge
            mc_target: '26.3'
            java_version: '25'
            jar_suffix: 'forge-26.3'
            modrinth_loaders: |-
              forge
            modrinth_game_versions: |-
              26.3
          - id: forge-26.2
            ref: forge
            mc_target: '26.2'
            java_version: '25'
            jar_suffix: 'forge-26.2'
            modrinth_loaders: |-
              forge
            modrinth_game_versions: |-
              26.2
          - id: forge-1.21
            ref: forge
            mc_target: '1.21'
            java_version: '21'
            jar_suffix: 'forge-1.21.x'
            modrinth_loaders: |-
              forge
            modrinth_game_versions: |-
              1.21.4
          # NeoForge mod builds (separate codebase, see the `neoforge` branch).
          - id: neoforge-26.3
            ref: neoforge
            mc_target: '26.3'
            java_version: '25'
            jar_suffix: 'neoforge-26.3'
            modrinth_loaders: |-
              neoforge
            modrinth_game_versions: |-
              26.3
          - id: neoforge-26.2
            ref: neoforge
            mc_target: '26.2'
            java_version: '25'
            jar_suffix: 'neoforge-26.2'
            modrinth_loaders: |-
              neoforge
            modrinth_game_versions: |-
              26.2
          - id: neoforge-1.21
            ref: neoforge
            mc_target: '1.21'
            java_version: '21'
            jar_suffix: 'neoforge-1.21.x'
            modrinth_loaders: |-
              neoforge
            modrinth_game_versions: |-
              1.21.4
    env:
      SKIP_LEG: ${{ github.event.inputs.legs != '' && !contains(format(',{0},', github.event.inputs.legs), format(',{0},', matrix.id)) }}
    steps:
      - name: Checkout repository
        if: env.SKIP_LEG != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || github.ref }}

      - name: Set version metadata
        if: env.SKIP_LEG != 'true'
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            RELEASE_TAG="v${{ github.event.inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          JAR_SUFFIX="${{ matrix.jar_suffix }}"
          MODRINTH_VERSION="${VERSION}+${JAR_SUFFIX}"
          MODRINTH_NAME="NoNetherite+ [v${VERSION}+${JAR_SUFFIX}]"
          JAR_FILE="NoNetheritePlus-${VERSION}-${JAR_SUFFIX}.jar"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MODRINTH_VERSION=$MODRINTH_VERSION" >> "$GITHUB_ENV"
          echo "MODRINTH_NAME=$MODRINTH_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"

      - name: Set changelog
        if: env.SKIP_LEG != 'true'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          MANUAL_CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          {
            echo 'CHANGELOG<<EOF'
            if [ "${{ github.event_name }}" = "release" ]; then
              printf '%s\n' "$RELEASE_BODY"
            else
              printf '%s\n' "$MANUAL_CHANGELOG"
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"

      # Both JDKs are installed: Gradle itself runs on 25 (newer Loom needs it)
      # and the build's toolchain picks 21 or 25 from mcTarget.
      - name: Set up JDK 21 + 25
        if: env.SKIP_LEG != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin
          cache: gradle

      - name: Build with Gradle
        if: env.SKIP_LEG != 'true'
        run: ./gradlew build --no-daemon -PreleaseVersion="$VERSION" -PmcTarget="${{ matrix.mc_target }}"

      - name: Upload to Modrinth
        if: env.SKIP_LEG != 'true'
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: HWcWUr8v
          name: ${{ env.MODRINTH_NAME }}
          version: ${{ env.MODRINTH_VERSION }}
          changelog: ${{ env.CHANGELOG }}
          loaders: ${{ matrix.modrinth_loaders }}
          game-versions: ${{ matrix.modrinth_game_versions }}
          files: build/libs/${{ env.JAR_FILE }}

      - name: Upload jar to GitHub Release
        if: env.SKIP_LEG != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "build/libs/${JAR_FILE}" --clobber
          else
            echo "No GitHub release $RELEASE_TAG; skipping jar upload."
          fi

  notify-discord:
    name: Discord notification
    needs: release
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Set version metadata
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            GITHUB_RELEASE_URL="${{ github.event.release.html_url }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            GITHUB_RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v${VERSION#v}"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "GITHUB_RELEASE_URL=$GITHUB_RELEASE_URL" >> "$GITHUB_ENV"
          BASE="https://modrinth.com/plugin/nonetherite+/version/${VERSION}%2B"
          echo "MODRINTH_26_URL=${BASE}26.x.x" >> "$GITHUB_ENV"
          echo "MODRINTH_121_URL=${BASE}1.21.x" >> "$GITHUB_ENV"
          echo "MODRINTH_VERSIONS_URL=https://modrinth.com/plugin/nonetherite+/versions" >> "$GITHUB_ENV"

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping Discord notification."
            exit 0
          fi

          CONTENT=$(printf '%s\n' \
            "@everyone" \
            "" \
            "**NoNetherite+ v${VERSION}** is out!" \
            "" \
            "GitHub release: ${GITHUB_RELEASE_URL}" \
            "Modrinth (paper/spigot/bukkit/purpur/folia, 26.x): ${MODRINTH_26_URL}" \
            "Modrinth (paper/spigot/bukkit/purpur/folia, 1.21.x): ${MODRINTH_121_URL}" \
            "Modrinth (fabric/quilt, forge, neoforge — 26.3, 26.2, 1.21.x): ${MODRINTH_VERSIONS_URL}")

          jq -n \
            --arg content "$CONTENT" \
            '{
              content: $content,
              allowed_mentions: { parse: ["everyone"] }
            }' | curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d @- \
            "$DISCORD_WEBHOOK_URL"
