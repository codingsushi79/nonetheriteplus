name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.6.0)
        required: true
      changelog:
        description: Changelog (markdown)
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Paper API-compatible builds (Paper/Spigot/Bukkit/Purpur/Folia all run the same jar)
          - id: paper-26
            mc_target: '26'
            java_version: '25'
            jar_suffix: '26.x.x'
            modrinth_loaders: |-
              paper
              spigot
              bukkit
              purpur
              folia
            modrinth_game_versions: |-
              26.1.x
          - id: paper-1.21
            mc_target: '1.21'
            java_version: '21'
            jar_suffix: '1.21.x'
            modrinth_loaders: |-
              paper
              spigot
              bukkit
              purpur
              folia
            modrinth_game_versions: |-
              1.21.x
          # Fabric mod build. Quilt is tagged onto the same jar: Quilt Loader
          # runs Fabric mods unmodified via Quilted Fabric API, and this mod
          # only uses stock fabric-api, so there's no separate Quilt codebase.
          - id: fabric-1.21
            ref: fabric
            mc_target: '1.21'
            java_version: '21'
            jar_suffix: 'fabric-1.21.x'
            modrinth_loaders: |-
              fabric
              quilt
            modrinth_game_versions: |-
              1.21.4
          # Forge mod build (separate codebase, see the `forge` branch).
          - id: forge-1.21
            ref: forge
            mc_target: '1.21'
            java_version: '21'
            jar_suffix: 'forge-1.21.x'
            modrinth_loaders: |-
              forge
            modrinth_game_versions: |-
              1.21.4
          # NeoForge mod build (separate codebase, see the `neoforge` branch).
          - id: neoforge-1.21
            ref: neoforge
            mc_target: '1.21'
            java_version: '21'
            jar_suffix: 'neoforge-1.21.x'
            modrinth_loaders: |-
              neoforge
            modrinth_game_versions: |-
              1.21.4
          # NOTE: 26.x builds for fabric/forge/neoforge are intentionally not
          # in this matrix yet. Mojang has not published official mappings
          # for any 26.x release, which Fabric Loom/ForgeGradle/NeoGradle all
          # need to build against the game jar. Add matrix entries here
          # (mc_target: '26', ref: fabric/forge/neoforge) once that lands
          # upstream -- the branches' build.gradle files already support
          # -PmcTarget=26.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || github.ref }}

      - name: Set version metadata
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            RELEASE_TAG="v${{ github.event.inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          JAR_SUFFIX="${{ matrix.jar_suffix }}"
          MODRINTH_VERSION="${VERSION}+${JAR_SUFFIX}"
          MODRINTH_NAME="NoNetherite+ [v${VERSION}+${JAR_SUFFIX}]"
          JAR_FILE="NoNetheritePlus-${VERSION}-${JAR_SUFFIX}.jar"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MODRINTH_VERSION=$MODRINTH_VERSION" >> "$GITHUB_ENV"
          echo "MODRINTH_NAME=$MODRINTH_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"

      - name: Set changelog
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          MANUAL_CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          {
            echo 'CHANGELOG<<EOF'
            if [ "${{ github.event_name }}" = "release" ]; then
              printf '%s\n' "$RELEASE_BODY"
            else
              printf '%s\n' "$MANUAL_CHANGELOG"
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: temurin
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build --no-daemon -PreleaseVersion="$VERSION" -PmcTarget="${{ matrix.mc_target }}"

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: HWcWUr8v
          name: ${{ env.MODRINTH_NAME }}
          version: ${{ env.MODRINTH_VERSION }}
          changelog: ${{ env.CHANGELOG }}
          loaders: ${{ matrix.modrinth_loaders }}
          game-versions: ${{ matrix.modrinth_game_versions }}
          files: build/libs/${{ env.JAR_FILE }}

      - name: Upload jar to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "build/libs/${JAR_FILE}" --clobber

  notify-discord:
    name: Discord notification
    needs: release
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Set version metadata
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            GITHUB_RELEASE_URL="${{ github.event.release.html_url }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            GITHUB_RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v${VERSION#v}"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "GITHUB_RELEASE_URL=$GITHUB_RELEASE_URL" >> "$GITHUB_ENV"
          echo "MODRINTH_26_URL=https://modrinth.com/plugin/nonetherite+/version/${VERSION}%2B26.x.x" >> "$GITHUB_ENV"
          echo "MODRINTH_121_URL=https://modrinth.com/plugin/nonetherite+/version/${VERSION}%2B1.21.x" >> "$GITHUB_ENV"
          echo "MODRINTH_FABRIC_URL=https://modrinth.com/plugin/nonetherite+/version/${VERSION}%2Bfabric-1.21.x" >> "$GITHUB_ENV"
          echo "MODRINTH_FORGE_URL=https://modrinth.com/plugin/nonetherite+/version/${VERSION}%2Bforge-1.21.x" >> "$GITHUB_ENV"
          echo "MODRINTH_NEOFORGE_URL=https://modrinth.com/plugin/nonetherite+/version/${VERSION}%2Bneoforge-1.21.x" >> "$GITHUB_ENV"

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping Discord notification."
            exit 0
          fi

          CONTENT=$(printf '%s\n' \
            "@everyone" \
            "" \
            "**NoNetherite+ v${VERSION}** is out!" \
            "" \
            "GitHub release: ${GITHUB_RELEASE_URL}" \
            "Modrinth (paper/spigot/bukkit/purpur/folia, 26.x): ${MODRINTH_26_URL}" \
            "Modrinth (paper/spigot/bukkit/purpur/folia, 1.21.x): ${MODRINTH_121_URL}" \
            "Modrinth (fabric/quilt): ${MODRINTH_FABRIC_URL}" \
            "Modrinth (forge): ${MODRINTH_FORGE_URL}" \
            "Modrinth (neoforge): ${MODRINTH_NEOFORGE_URL}")

          jq -n \
            --arg content "$CONTENT" \
            '{
              content: $content,
              allowed_mentions: { parse: ["everyone"] }
            }' | curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d @- \
            "$DISCORD_WEBHOOK_URL"
