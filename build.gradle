plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'com.gradleup.shadow' version '9.6.0'
}

group = 'com.codingsushi'
version = findProperty('releaseVersion') ?: '1.6.0'

def mcTarget = findProperty('mcTarget') ?: '1.21'

def targetConfigs = [
    '26': [
        neoforgeVersion : '26.1.0.25-beta',
        javaVersion     : 25,
        gameVersionTag  : '26.x.x',
    ],
    '1.21': [
        neoforgeVersion : '21.4.157',
        javaVersion     : 21,
        gameVersionTag  : '1.21.x',
    ],
]

if (!targetConfigs.containsKey(mcTarget)) {
    throw new GradleException("Unknown mcTarget '${mcTarget}'. Expected one of: ${targetConfigs.keySet()}")
}

def activeTarget = targetConfigs[mcTarget]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(activeTarget.javaVersion)
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir "src/${mcTarget}/java"
        }
    }
}

neoForge {
    version = activeTarget.neoforgeVersion
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

repositories {
    mavenCentral()
}

dependencies {
    shade 'org.yaml:snakeyaml:2.3'
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: version
    }
}

shadowJar {
    archiveFileName = "NoNetheritePlus-${version}-neoforge-${activeTarget.gameVersionTag}.jar"
    archiveClassifier = ''
    configurations = [project.configurations.shade]
}

tasks.named('assemble') {
    dependsOn 'shadowJar'
}
