plugins {
    id 'java'
}

group = 'com.codingsushi'
version = findProperty('releaseVersion') ?: '1.5.0'

def mcTarget = findProperty('mcTarget') ?: '26'

def targetConfigs = [
    '26': [
        paperApi       : 'io.papermc.paper:paper-api:26.1.2.build.69-stable',
        javaVersion    : 25,
        apiVersion     : '1.26',
        gameVersionTag : '26.x.x',
    ],
    '1.21': [
        paperApi       : 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT',
        javaVersion    : 21,
        apiVersion     : '1.21',
        gameVersionTag : '1.21.x',
    ],
]

if (!targetConfigs.containsKey(mcTarget)) {
    throw new GradleException("Unknown mcTarget '${mcTarget}'. Expected one of: ${targetConfigs.keySet()}")
}

def activeTarget = targetConfigs[mcTarget]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(activeTarget.javaVersion)
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir "src/${mcTarget}/java"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
}

dependencies {
    compileOnly activeTarget.paperApi
    compileOnly 'me.clip:placeholderapi:2.11.6'
}

jar {
    archiveFileName = "NoNetheritePlus-${version}-${activeTarget.gameVersionTag}.jar"
}

processResources {
    filesMatching('plugin.yml') {
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
            VERSION     : version.toString(),
            API_VERSION : activeTarget.apiVersion,
        ])
    }
}
