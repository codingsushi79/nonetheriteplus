plugins {
    id 'java'
    id 'fabric-loom' version '1.17.16'
}

group = 'com.codingsushi'
version = findProperty('releaseVersion') ?: '1.6.0'

def mcTarget = findProperty('mcTarget') ?: '1.21'

def targetConfigs = [
    '26': [
        minecraftVersion: '26.1.2',
        loaderVersion   : '0.19.3',
        fabricApiVersion: '0.155.2+26.1.2',
        javaVersion     : 25,
        gameVersionTag  : '26.x.x',
    ],
    '1.21': [
        minecraftVersion: '1.21.4',
        loaderVersion   : '0.19.3',
        fabricApiVersion: '0.119.4+1.21.4',
        javaVersion     : 21,
        gameVersionTag  : '1.21.x',
    ],
]

if (!targetConfigs.containsKey(mcTarget)) {
    throw new GradleException("Unknown mcTarget '${mcTarget}'. Expected one of: ${targetConfigs.keySet()}")
}

def activeTarget = targetConfigs[mcTarget]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(activeTarget.javaVersion)
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir "src/${mcTarget}/java"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${activeTarget.minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${activeTarget.loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${activeTarget.fabricApiVersion}"
    implementation 'org.yaml:snakeyaml:2.3'
    include 'org.yaml:snakeyaml:2.3'
}

loom {
    serverOnlyMinecraftJar()
}

processResources {
    inputs.property 'version', version
    inputs.property 'gameVersionTag', activeTarget.gameVersionTag
    filesMatching('fabric.mod.json') {
        expand version: version, gameVersionTag: activeTarget.gameVersionTag
    }
}

jar {
    archiveFileName = "NoNetheritePlus-${version}-fabric-${activeTarget.gameVersionTag}.jar"
}

remapJar {
    archiveFileName = "NoNetheritePlus-${version}-fabric-${activeTarget.gameVersionTag}.jar"
}
