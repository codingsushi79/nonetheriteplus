plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.gradleup.shadow' version '9.6.0'
}

group = 'com.codingsushi'
version = findProperty('releaseVersion') ?: '1.6.1'

def mcTarget = findProperty('mcTarget') ?: '1.21'

def targetConfigs = [
    '26.3': [
        minecraftVersion: '26.3',
        neoforgeVersion : '26.3.0.113',
        javaVersion     : 25,
        gameVersionTag  : '26.3',
        srcDirs         : ['26', '26.3'],
    ],
    '26.2': [
        minecraftVersion: '26.2',
        neoforgeVersion : '26.2.0.95',
        javaVersion     : 25,
        gameVersionTag  : '26.2',
        srcDirs         : ['26', '26.2'],
    ],
    '1.21': [
        minecraftVersion: '1.21.4',
        neoforgeVersion : '21.4.157',
        javaVersion     : 21,
        gameVersionTag  : '1.21.x',
        srcDirs         : ['1.21'],
    ],
]
// Backwards-compatible alias: -PmcTarget=26 builds the newest 26.x target.
targetConfigs['26'] = targetConfigs['26.3']

if (!targetConfigs.containsKey(mcTarget)) {
    throw new GradleException("Unknown mcTarget '${mcTarget}'. Expected one of: ${targetConfigs.keySet()}")
}

def activeTarget = targetConfigs[mcTarget]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(activeTarget.javaVersion)
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            activeTarget.srcDirs.each { srcDir "src/${it}/java" }
        }
    }
}

neoForge {
    version = activeTarget.neoforgeVersion
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

repositories {
    mavenCentral()
}

dependencies {
    shade 'org.yaml:snakeyaml:2.3'
}

processResources {
    inputs.property 'version', version
    inputs.property 'minecraftVersion', activeTarget.minecraftVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: version,
            minecraftRange: mcTarget == '1.21' ? '[1.21.4,1.21.5)' : "[${activeTarget.minecraftVersion},${activeTarget.minecraftVersion}.99)"
    }
}

shadowJar {
    archiveFileName = "NoNetheritePlus-${version}-neoforge-${activeTarget.gameVersionTag}.jar"
    archiveClassifier = ''
    configurations = [project.configurations.shade]
}

tasks.named('assemble') {
    dependsOn 'shadowJar'
}
